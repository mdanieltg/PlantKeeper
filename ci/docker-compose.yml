name: plantkeeper
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PWD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-plants}
    volumes:
      - mysql-data:/var/lib/mysql
    # Reachable as db:3306 from inside the network only - nothing is published to the
    # host. Add a ports mapping if you need Rider or a mysql client to connect.
    #expose:
      #- "3306"
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PWD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - plantkeeper-net

  # Runs alongside `db`, not in place of it. The API is still on Pomelo/MySQL, so
  # nothing reads this yet - it exists so the provider swap can be attempted against a
  # database already known to be working. Once that swap is verified, `db` and its
  # volume go away and this service takes the name.
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PWD}
      POSTGRES_DB: ${POSTGRES_DB:-plants}
    volumes:
      # Deliberately not mysql-data. The two must never share a volume, and keeping
      # them separate is what makes rolling back to MySQL free.
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-plants}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - plantkeeper-net

  backend:
    build:
      context: ..
      dockerfile: ci/backend.dockerfile
    expose:
      - "8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      # Pinned: DatabaseServiceExtensions picks the connection string key from the
      # environment name, so Development is what makes ConnectionStrings__Dev the one
      # it reads.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Dev: ${CONNECTION_STRING}
    depends_on:
      postgres:
        # Npgsql opens no connection at startup, so the API would boot against a
        # database still initialising and fail on the first request instead. Waiting
        # for healthy keeps the failure at `up` time, where it is visible.
        condition: service_healthy
    networks:
      - plantkeeper-net

  frontend:
    build:
      context: ..
      dockerfile: ci/frontend.dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - plantkeeper-net

volumes:
  mysql-data:
  postgres-data:

networks:
  plantkeeper-net:
    driver: bridge
