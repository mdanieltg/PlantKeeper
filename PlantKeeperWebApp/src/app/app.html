<div class="min-h-screen">
  <header class="sticky top-0 z-40 border-b border-bark-200 bg-white/85 backdrop-blur">
    <div class="mx-auto flex h-14 max-w-6xl items-center gap-6 px-4">
      <a routerLink="/" class="flex items-center gap-2 font-semibold text-bark-900">
        <span class="text-lg" aria-hidden="true">🌱</span>
        PlantKeeper
      </a>

      <nav class="flex items-center gap-1">
        @for (item of nav(); track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="bg-leaf-100 text-leaf-800"
            class="rounded-lg px-3 py-1.5 text-sm font-medium text-bark-600 transition hover:bg-bark-100 hover:text-bark-900"
          >
            {{ item.label }}
          </a>
        }
      </nav>

      @if (signedIn()) {
        <div class="ml-auto flex items-center gap-3">
          <span class="text-sm text-bark-600">{{ displayName() }}</span>
          <button
            type="button"
            class="rounded-lg px-3 py-1.5 text-sm font-medium text-bark-600 transition hover:bg-bark-100 hover:text-bark-900"
            (click)="signOut()"
          >
            Sign out
          </button>
        </div>
      }
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-8">
    <router-outlet />
  </main>
</div>
