name: plantkeeper

services:
  backend:
    image: localhost:5000/plantkeeper-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Production: ${CONNECTION_STRING}
      Bootstrap__Secret: ${BOOTSTRAP_SECRET:-}
      # Load-bearing: unset, the app refuses to start outside Development. The keys
      # that sign the session cookie live here, so a redeploy that loses them signs
      # out everyone who was signed in - silently, and only for them.
      DataProtection__KeyPath: /keys
    expose:
      - "8080"
    volumes:
      - dataprotection-keys:/keys
    networks:
      - internal
      - app-network

  frontend:
    image: localhost:5000/plantkeeper-frontend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5004:80"
    depends_on:
      - backend
    networks:
      - internal

volumes:
  dataprotection-keys:

networks:
  internal:
    driver: bridge
  app-network:
    external: true

