# The scheme the browser actually used, not the one this hop arrived on.
#
# TLS is terminated in front of this container, so every request reaches nginx over
# plain HTTP and `$scheme` is always `http`. Sending that as X-Forwarded-Proto
# overwrites what the terminator told us, and the backend then believes every request
# was insecure: `Request.IsHttps` is false, and `app.UseHsts()` skips non-HTTPS
# requests, so the HSTS header is never emitted.
#
# Only `https` is honoured, and anything else falls back to `$scheme`. The header is
# attacker-controlled for anyone who can reach the published port directly, and this
# way an unexpected value degrades to what nginx itself saw rather than being passed
# through. When nginx is the edge and listens on 443, `$scheme` is already right.
map $http_x_forwarded_proto $client_proto {
    default $scheme;
    https   https;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
