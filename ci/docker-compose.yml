name: plantkeeper
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PWD}
      POSTGRES_DB: ${POSTGRES_DB:-plants}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Published to loopback only, so host tooling can reach it and nothing outside can.
    # Keep the 127.0.0.1 prefix: a bare 5432:5432 binds every interface, and Docker
    # publishes past the host firewall.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-plants}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - plantkeeper-net

  backend:
    build:
      context: ..
      dockerfile: ci/backend.dockerfile
    expose:
      - "8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      # Pinned: DatabaseServiceExtensions picks the connection string key from the
      # environment name, so Development is what makes ConnectionStrings__Dev the one
      # it reads.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Dev: ${CONNECTION_STRING}
      Bootstrap__Secret: ${BOOTSTRAP_SECRET:-}
      # The DataProtection key ring, on a volume rather than in the container's
      # writable layer. Without it every `up --build` mints new keys and every
      # session cookie issued before the rebuild stops decrypting.
      DataProtection__KeyPath: /keys
    volumes:
      - dataprotection-keys:/keys
    depends_on:
      db:
        # Npgsql opens no connection at startup, so the API would boot against a
        # database still initialising and fail on the first request instead. Waiting
        # for healthy keeps the failure at `up` time, where it is visible.
        condition: service_healthy
    networks:
      - plantkeeper-net

  frontend:
    build:
      context: ..
      dockerfile: ci/frontend.dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - plantkeeper-net

volumes:
  postgres-data:
  dataprotection-keys:

networks:
  plantkeeper-net:
    driver: bridge
